<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/dto-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F4F6" />
    <meta
      name="description"
      content="Sito ufficiale di DTO Solution e delle sue applicazioni."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="DTO Solution" />
    <meta name="contact" content="dtosolution@gmail.com" />
    <link rel="canonical" href="https://www.dtosolution.it" />
    <link rel="alternate" hreflang="it" href="https://www.dtosolution.it" />
    <link rel="alternate" hreflang="en" href="https://www.dtosolution.com" />
    <link rel="alternate" hreflang="x-default" href="https://www.dtosolution.it" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DTO Solution | Sito ufficiale" />
    <meta property="og:url" content="https://dtosolution.it" />
    <meta
      property="og:description"
      content="Sito ufficiale di DTO Solution e delle sue applicazioni."
    />
    <title>DTO Solution | Sito ufficiale</title>
  </head>
  <body>
    <script>
      const initialLanguage = location.hostname.replace(/^www\./, '') === 'dtosolution.com' ? 'en' : 'it'
      const initialPath = location.pathname === '/' ? '/' : location.pathname.replace(/\/$/, '')
      const initialOrigin = initialLanguage === 'en' ? 'https://www.dtosolution.com' : 'https://www.dtosolution.it'
      const initialTitle = initialLanguage === 'en' ? 'DTO Solution | Official website' : 'DTO Solution | Sito ufficiale'
      const initialDescription = initialLanguage === 'en'
        ? 'DTO Solution develops applications and software to simplify work, documents and everyday tasks.'
        : 'DTO Solution sviluppa applicazioni e software per semplificare il lavoro, i documenti e le attività quotidiane.'

      document.documentElement.lang = initialLanguage
      document.title = initialTitle
      document.querySelector('meta[name="description"]').content = initialDescription
      document.querySelector('meta[property="og:title"]').content = initialTitle
      document.querySelector('meta[property="og:description"]').content = initialDescription
      document.querySelector('meta[property="og:locale"]').content = initialLanguage === 'en' ? 'en_US' : 'it_IT'
      document.querySelector('meta[property="og:url"]').content = `${initialOrigin}${initialPath}`
      document.querySelector('link[rel="canonical"]').href = `${initialOrigin}${initialPath}`
      document.querySelector('link[rel="alternate"][hreflang="it"]').href = `https://www.dtosolution.it${initialPath}`
      document.querySelector('link[rel="alternate"][hreflang="en"]').href = `https://www.dtosolution.com${initialPath}`
      document.querySelector('link[rel="alternate"][hreflang="x-default"]').href = `https://www.dtosolution.it${initialPath}`
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
